name: Sonatype Launcher release
on:
  workflow_dispatch:
    inputs:
      launcher_ver:
        description: the version of sbt to release
        required: true
        default: 1.0.x

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            java: 11
            distribution: temurin
    runs-on: ${{ matrix.os }}
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M
      LAUNCHER_VER: ${{ github.event.inputs.launcher_ver }}
    steps:
    - name: Checkout sbt/sbt-dist
      uses: actions/checkout@v7
    - name: Checkout sbt/zinc
      uses: actions/checkout@v7
      with:
        repository: sbt/launcher
        ref: v${{ github.event.inputs.launcher_ver }}
        path: launcher
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: "${{ matrix.distribution }}"
        java-version: "${{ matrix.java }}"
    - name: Distrust compromised eMudhra intermediate CAs
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          bash bin/distrust-emudhra.sh "$JAVA_HOME"
        else
          sudo -E bash bin/distrust-emudhra.sh "$JAVA_HOME"
        fi
    - uses: sbt/setup-sbt@v1
    - name: Build
      shell: bash
      run: |
        mode=sonatype_launcher bin/run-ci.sh
      env:
        SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
        SONATYPE_PASS: ${{ secrets.SONATYPE_PASS }}
        PGP_SECRET: ${{ secrets.PGP_SECRET }}
        PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        RELEASE_COMMAND: "release sonaRelease"
